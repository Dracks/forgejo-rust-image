name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository_owner }}/forgejo-rust-job

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta-info.outputs.image_name }}
      short_sha: ${{ steps.meta-info.outputs.short_sha }}
    steps:
      - name: Compute lowercase image name and short sha
        id: meta-info
        run: |
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
        - platform: amd64
          runner: ubuntu-24.04
        - platform: arm64
          runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/${{ matrix.platform }}
          tags: |
            ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:latest-${{ matrix.platform }}
            ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:sha-${{needs.prepare.outputs.short_sha}}-${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}

  multiarch:
    needs: [build, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:latest \
            ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:sha-${{needs.prepare.outputs.short_sha}}-amd64 \
            ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:sha-${{needs.prepare.outputs.short_sha}}-arm64
          docker buildx imagetools create \
            --tag ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:sha-${{needs.prepare.outputs.short_sha}} \
            ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:sha-${{needs.prepare.outputs.short_sha}}-amd64 \
            ${{env.REGISTRY}}/${{needs.prepare.outputs.image_name}}:sha-${{needs.prepare.outputs.short_sha}}-arm64
